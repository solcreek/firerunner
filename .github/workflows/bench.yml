name: bench

# Dogfooding benchmark: run firerunner's own build+test on GitHub-hosted
# (ubuntu-latest) vs the self-hosted firerunner scale set. Step durations and
# queue->start latency are read back from the Actions API, so no extra tooling
# is baked into the guest.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, firerunner]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Runner info
        run: |
          echo "runner=${{ matrix.runner }}"
          uname -a
          echo "nproc=$(nproc)"
          free -m | head -2 || true
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Go env
        run: go version
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
