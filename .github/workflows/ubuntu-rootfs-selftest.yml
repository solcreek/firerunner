name: ubuntu-rootfs-selftest

# Smoke test for the "full" ubuntu-rootfs golden (build-ubuntu-rootfs.sh
# --toolset full): confirms the baked-in actions/runner-images tool cache is
# present and wired up (RUNNER_TOOL_CACHE), and that the cached Go/Node/Python
# toolchains actually run. Dispatch against a firerunner listener booting the
# full golden.
on:
  workflow_dispatch:

jobs:
  toolcache:
    runs-on: firerunner
    steps:
      - name: baked tool cache present + consumed
        run: |
          set -e
          TC="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-unset}"
          echo "AGENT_TOOLSDIRECTORY=${AGENT_TOOLSDIRECTORY:-unset}"
          echo "cache tools: $(ls "$TC" 2>/dev/null | tr '\n' ' ')"
          for t in Python node go; do
            test -d "$TC/$t" || { echo "MISSING: $t not in tool cache"; exit 1; }
            echo "$t: $(ls "$TC/$t" | tr '\n' ' ')"
          done
          # run the newest cached toolchain of each to prove they work
          GO=$(ls -d "$TC"/go/*/x64/bin/go | sort -V | tail -1)
          NODE=$(ls -d "$TC"/node/*/x64/bin/node | sort -V | tail -1)
          PY=$(ls -d "$TC"/Python/*/x64/bin/python3 | sort -V | tail -1)
          echo "go:     $("$GO" version)"
          echo "node:   $("$NODE" --version)"
          echo "python: $("$PY" --version)"
