name: ubuntu-rootfs-check

# Smoke test for the "full" ubuntu-rootfs golden (build-ubuntu-rootfs.sh
# --toolset full): confirms the baked-in actions/runner-images tool cache is
# present on the rootfs and that the cached Go/Node/Python toolchains run.
# Also dumps how the runner resolved RUNNER_TOOL_CACHE so we can see whether
# firerunner-run.sh wired AGENT_TOOLSDIRECTORY to the baked cache.
on:
  workflow_dispatch:

jobs:
  toolcache:
    runs-on: firerunner
    steps:
      - name: runtime tool-cache wiring
        run: |
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-unset}"
          echo "AGENT_TOOLSDIRECTORY=${AGENT_TOOLSDIRECTORY:-unset}"
          echo "--- mounts ---"; mount | grep -Ei 'hostedtoolcache|/opt' || echo "(no /opt or hostedtoolcache mount)"
          echo "--- blkid ---"; (command -v blkid >/dev/null && blkid || echo "blkid not installed")
      - name: baked tool cache present + runnable
        run: |
          set -e
          # Read the baked cache directly off the rootfs: this proves --toolset
          # full produced a usable /opt/hostedtoolcache regardless of env wiring.
          TC=/opt/hostedtoolcache
          test -d "$TC" || { echo "MISSING: $TC does not exist"; exit 1; }
          echo "cache tools: $(ls "$TC" | tr '\n' ' ')"
          for t in Python node go; do
            test -d "$TC/$t" || { echo "MISSING: $t not in tool cache"; exit 1; }
            echo "$t: $(ls "$TC/$t" | tr '\n' ' ')"
          done
          GO=$(ls -d "$TC"/go/*/x64/bin/go | sort -V | tail -1)
          NODE=$(ls -d "$TC"/node/*/x64/bin/node | sort -V | tail -1)
          PY=$(ls -d "$TC"/Python/*/x64/bin/python3 | sort -V | tail -1)
          echo "go:     $("$GO" version)"
          echo "node:   $("$NODE" --version)"
          echo "python: $("$PY" --version)"
      - name: boot policy (only the runner should auto-start)
        run: |
          # Faithful golden installs docker/DBs but boots with them disabled so
          # the microVM reaches an idle runner fast. docker.socket stays enabled
          # for on-demand socket activation.
          echo "os: $(. /etc/os-release; echo "$PRETTY_NAME") glibc $(ldd --version | head -1 | awk '{print $NF}')"
          echo "uptime at job start: $(cut -d' ' -f1 /proc/uptime)s"
          echo "docker.service:  $(systemctl is-active docker 2>/dev/null || true) / $(systemctl is-enabled docker 2>/dev/null || true)"
          echo "docker.socket:   $(systemctl is-active docker.socket 2>/dev/null || true) / $(systemctl is-enabled docker.socket 2>/dev/null || true)"
          echo "containerd:      $(systemctl is-active containerd 2>/dev/null || true) / $(systemctl is-enabled containerd 2>/dev/null || true)"
          echo "--- masked/off noise ---"
          for u in snapd apt-daily.timer motd-news.timer systemd-networkd-wait-online; do
            echo "$u: $(systemctl is-enabled "$u" 2>/dev/null || echo n/a)"
          done
      - name: docker on demand + egress survives docker networking
        run: |
          set -e
          gh_code() { curl -sS -o /dev/null -w '%{http_code}' https://api.github.com/zen; }
          echo "--- egress BEFORE docker starts ---"
          before=$(gh_code || true)
          echo "api.github.com before docker: $before"
          echo "--- start docker (socket activation) ---"
          time docker version
          echo "--- docker run hello-world (daemon + registry pull + container net) ---"
          sudo docker run --rm hello-world | grep -i "hello from docker" && echo "docker run: OK"
          echo "--- egress AFTER docker brought up iptables/docker0 ---"
          ip -br addr show docker0 2>/dev/null || echo "(no docker0 yet)"
          after=$(gh_code || true)
          echo "api.github.com after docker:  $after"
          test "$after" = "200" || { echo "REGRESSION: runner egress broke after docker networking (HTTP $after)"; exit 1; }
